name: Deploy DiamondDB mockup

on:
  push:
    branches: [main]
    paths:
      - 'projects/diamonddb/mockup/**'
      - '.github/workflows/pages.yml'
      - 'scripts/check.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check demo and mockup
        run: |
          node scripts/check.mjs
          node --check projects/diamonddb/mockup/app.js
          git diff --check
          test -s projects/diamonddb/mockup/index.html
          test -s projects/diamonddb/mockup/style.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: projects/diamonddb/mockup
      - name: Deploy mockup
        id: deployment
        uses: actions/deploy-pages@v5
